<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desarrollos — Próximamente</title>
<meta name="description" content="Estamos trabajando en nuevos desarrollos. Muy pronto, novedades.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d10;
    --fg:#f2efe8;
    --muted:#8a8780;
    --accent:#d4ff3a;
    --line:rgba(242,239,232,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"Space Grotesk",system-ui,sans-serif;
    display:flex;flex-direction:column;
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }
  /* grilla de fondo */
  body::before{
    content:"";position:fixed;inset:0;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);
    pointer-events:none;
  }
  /* brillo */
  .glow{
    position:fixed;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(212,255,58,.18),transparent 65%);
    top:50%;left:50%;transform:translate(-50%,-50%);
    animation:breathe 6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.8}
    50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  }
  header,footer{
    position:relative;z-index:1;
    padding:28px 40px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:"JetBrains Mono",monospace;font-size:12px;
    color:var(--muted);letter-spacing:.08em;text-transform:uppercase;
  }
  .status{display:flex;align-items:center;gap:10px}
  .dot{
    width:8px;height:8px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 0 rgba(212,255,58,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(212,255,58,.6)}
    70%{box-shadow:0 0 0 10px rgba(212,255,58,0)}
    100%{box-shadow:0 0 0 0 rgba(212,255,58,0)}
  }
  main{
    position:relative;z-index:1;flex:1;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:0 24px;
  }
  .tag{
    font-family:"JetBrains Mono",monospace;font-size:13px;
    color:var(--accent);margin-bottom:28px;
  }
  .tag .cursor{
    display:inline-block;width:8px;height:15px;background:var(--accent);
    vertical-align:-2px;margin-left:4px;animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  h1{
    font-size:clamp(48px,10vw,128px);
    font-weight:700;line-height:.92;letter-spacing:-.04em;
  }
  h1 span{
    display:block;
    color:transparent;
    -webkit-text-stroke:1.5px var(--fg);
  }
  p{
    margin-top:32px;max-width:440px;
    font-size:18px;line-height:1.55;color:var(--muted);
  }
  .bar{
    margin-top:44px;width:min(320px,80vw);height:2px;
    background:var(--line);border-radius:2px;overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:35%;background:var(--accent);
    animation:load 2.4s cubic-bezier(.65,0,.35,1) infinite;
  }
  @keyframes load{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(300%)}
  }
  @media (max-width:600px){
    header,footer{padding:20px;font-size:11px}
    p{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <header>
    <div class="status"><span class="dot"></span>En construcción</div>
    <div>Buenos Aires</div>
  </header>

  <main>
    <div class="tag">// cargando nuevos proyectos<span class="cursor"></span></div>
    <h1>Desarrollos<span>próximamente</span></h1>
    <p>Estamos trabajando en algo nuevo. Muy pronto vas a poder verlo acá.</p>
    <div class="bar"><i></i></div>
  </main>

  <footer>
    <div>© <span id="y"></span></div>
    <div>Volvé pronto</div>
  </footer>

  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
